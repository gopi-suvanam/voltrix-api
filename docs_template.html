<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voltrix API — Reference</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --muted: #8b949e;
            --border: #30363d;
            --accent: #58a6ff;
            --surface: #161b22;
            --green: #3fb950;
            --code-bg: #1c2128;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        h1 { color: #fff; font-size: 2rem; margin: 0 0 0.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h2 { color: #fff; font-size: 1.5rem; margin: 2.5rem 0 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
        h3 { color: var(--accent); font-size: 1.15rem; margin: 2rem 0 0.75rem; }
        h4 { color: var(--fg); font-size: 1rem; margin: 1.5rem 0 0.5rem; }
        p { margin: 0.5rem 0; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        strong { color: #e6edf3; }
        hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
        code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.88em;
            color: #e6edf3;
        }
        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.75rem 0;
        }
        pre code {
            background: none;
            padding: 0;
            font-size: 0.85em;
            color: var(--fg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
            font-size: 0.9rem;
        }
        th {
            background: var(--surface);
            color: #e6edf3;
            font-weight: 600;
            text-align: left;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
        }
        td {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
        }
        tr:nth-child(even) { background: rgba(22, 27, 34, 0.5); }
        blockquote {
            border-left: 3px solid var(--accent);
            padding: 0.25rem 1rem;
            margin: 0.75rem 0;
            color: var(--muted);
            background: var(--surface);
            border-radius: 0 4px 4px 0;
        }
        ul, ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        li { margin: 0.25rem 0; }
    </style>
</head>
<body>
    {{content}}
</body>
</html>
