server {
    listen 80;
    server_name voltrix-api.scribbler.live;

    location / {
        proxy_pass http://api:8000;
    }
}

server {
    listen 443 ssl;
    server_name voltrix-api.scribbler.live;

    ssl_certificate /etc/letsencrypt/live/voltrix-api.scribbler.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voltrix-api.scribbler.live/privkey.pem;

    location / {
        proxy_pass http://api:8000;
    }
}
